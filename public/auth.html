<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجسّم — تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mj: {
                            bg: '#1a1d23',
                            panel: '#22252b',
                            primary: '#00b4d8',
                            secondary: '#48cae4',
                            text: '#e8edf2',
                            btn: '#00b4d8',
                            'btn-hover': '#0096c7',
                            warning: '#f48c06',
                            success: '#10b981',
                            error: '#ef4444',
                            card: '#2a2d35',
                            border: '#3a3d45',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        ibm: ['IBM Plex Sans Arabic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
            background: #1a1d23;
            color: #e8edf2;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Animated 3D Background ── */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-canvas canvas { width: 100%; height: 100%; }

        .grid-floor {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(rgba(0,180,216,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,180,216,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* Floating 3D shapes */
        .floating-shape {
            position: fixed;
            border: 1.5px solid rgba(0,180,216,0.12);
            border-radius: 4px;
            animation: floatShape 18s ease-in-out infinite;
            z-index: 0;
        }
        .floating-shape:nth-child(1) { width:80px; height:80px; top:10%; left:8%; animation-delay:0s; animation-duration:20s; }
        .floating-shape:nth-child(2) { width:50px; height:50px; top:60%; left:5%; animation-delay:3s; animation-duration:16s; border-radius:50%; }
        .floating-shape:nth-child(3) { width:100px; height:100px; top:20%; right:10%; animation-delay:6s; animation-duration:22s; }
        .floating-shape:nth-child(4) { width:40px; height:40px; top:75%; right:15%; animation-delay:2s; animation-duration:14s; transform:rotate(45deg); }
        .floating-shape:nth-child(5) { width:70px; height:70px; top:45%; left:15%; animation-delay:8s; animation-duration:18s; border-radius:50%; }
        .floating-shape:nth-child(6) { width:60px; height:60px; bottom:15%; right:8%; animation-delay:4s; animation-duration:24s; }

        @keyframes floatShape {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity:0.3; }
            25% { transform: translateY(-30px) rotate(15deg); opacity:0.5; }
            50% { transform: translateY(-15px) rotate(-10deg); opacity:0.35; }
            75% { transform: translateY(-40px) rotate(8deg); opacity:0.45; }
        }

        /* Glow orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.15;
            animation: orbPulse 8s ease-in-out infinite;
        }
        .glow-orb.orb-1 { width:400px; height:400px; background:#00b4d8; top:-10%; right:-5%; animation-delay:0s; }
        .glow-orb.orb-2 { width:300px; height:300px; background:#48cae4; bottom:-10%; left:-5%; animation-delay:4s; }
        .glow-orb.orb-3 { width:200px; height:200px; background:#00b4d8; top:50%; left:50%; animation-delay:2s; }

        @keyframes orbPulse {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.1); }
        }

        /* ── Auth Card ── */
        .auth-card {
            background: rgba(34,37,43,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid #3a3d45;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,180,216,0.05);
            transition: box-shadow 0.4s;
        }
        .auth-card:hover {
            box-shadow: 0 30px 70px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,180,216,0.1);
        }

        /* ── Tabs ── */
        .tab-btn {
            position: relative;
            padding: 12px 0;
            font-weight: 600;
            font-size: 15px;
            color: #8a8d95;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.3s;
            flex: 1;
            text-align: center;
        }
        .tab-btn.active { color: #00b4d8; }
        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            height: 2px;
            background: #00b4d8;
            transform: scaleX(0);
            transition: transform 0.3s;
            border-radius: 2px;
        }
        .tab-btn.active::after { transform: scaleX(1); }

        /* ── Inputs ── */
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #a0a3ab;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrap i.field-icon {
            position: absolute;
            right: 14px;
            color: #5a5d65;
            font-size: 14px;
            pointer-events: none;
            transition: color 0.3s;
            z-index: 2;
        }
        .input-wrap input {
            width: 100%;
            padding: 12px 42px 12px 42px;
            background: #1a1d23;
            border: 1.5px solid #3a3d45;
            border-radius: 10px;
            color: #e8edf2;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-wrap input::placeholder { color: #5a5d65; }
        .input-wrap input:focus {
            border-color: #00b4d8;
            box-shadow: 0 0 0 3px rgba(0,180,216,0.1);
        }
        .input-wrap input:focus ~ i.field-icon,
        .input-wrap input:focus + .toggle-password ~ i.field-icon { color: #00b4d8; }

        .toggle-password {
            position: absolute;
            left: 14px;
            background: none;
            border: none;
            color: #5a5d65;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color 0.3s;
            z-index: 2;
        }
        .toggle-password:hover { color: #00b4d8; }

        /* ── Password Strength ── */
        .strength-bar {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            height: 4px;
        }
        .strength-bar span {
            flex: 1;
            border-radius: 2px;
            background: #3a3d45;
            transition: background 0.3s;
        }
        .strength-text {
            font-size: 11px;
            margin-top: 4px;
            color: #5a5d65;
            text-align: left;
            direction: ltr;
        }

        /* ── Primary Button ── */
        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #00b4d8 0%, #0096c7 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0096c7 0%, #0077b6 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0,180,216,0.3);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary .spinner {
            display: none;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }
        .btn-primary.loading .btn-text { display: none; }
        .btn-primary.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Social Button ── */
        .btn-social {
            width: 100%;
            padding: 12px;
            background: #2a2d35;
            border: 1.5px solid #3a3d45;
            border-radius: 10px;
            color: #e8edf2;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .btn-social:hover {
            background: #353840;
            border-color: #4a4d55;
            transform: translateY(-1px);
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: #5a5d65;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #3a3d45;
        }

        /* ── Checkbox ── */
        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #a0a3ab;
        }
        .checkbox-wrap input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #1a1d23;
            border: 1.5px solid #3a3d45;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .checkbox-wrap input[type="checkbox"]:checked {
            background: #00b4d8;
            border-color: #00b4d8;
        }
        .checkbox-wrap input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.4s cubic-bezier(0.16,1,0.3,1);
            pointer-events: auto;
            min-width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .toast.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #10b981; }
        .toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
        .toast.warning { background: rgba(244,140,6,0.15); border: 1px solid rgba(244,140,6,0.3); color: #f48c06; }
        .toast.info { background: rgba(0,180,216,0.15); border: 1px solid rgba(0,180,216,0.3); color: #00b4d8; }
        .toast.hide { animation: toastOut 0.3s ease forwards; }

        @keyframes toastIn {
            0% { opacity:0; transform: translateY(-20px) scale(0.95); }
            100% { opacity:1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            0% { opacity:1; transform: translateY(0) scale(1); }
            100% { opacity:0; transform: translateY(-20px) scale(0.95); }
        }

        /* ── Logo Cube ── */
        .logo-cube-wrap {
            perspective: 200px;
            width: 44px; height: 44px;
            display: inline-block;
        }
        .logo-cube {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: cubeRotate 8s ease-in-out infinite;
        }
        .logo-cube .face {
            position: absolute;
            width: 44px; height: 44px;
            border: 2px solid #00b4d8;
            border-radius: 6px;
            background: rgba(0,180,216,0.08);
        }
        .logo-cube .front  { transform: translateZ(22px); }
        .logo-cube .back   { transform: rotateY(180deg) translateZ(22px); }
        .logo-cube .right  { transform: rotateY(90deg) translateZ(22px); }
        .logo-cube .left   { transform: rotateY(-90deg) translateZ(22px); }
        .logo-cube .top    { transform: rotateX(90deg) translateZ(22px); }
        .logo-cube .bottom { transform: rotateX(-90deg) translateZ(22px); }

        @keyframes cubeRotate {
            0%, 100% { transform: rotateX(-15deg) rotateY(25deg); }
            25% { transform: rotateX(-10deg) rotateY(115deg); }
            50% { transform: rotateX(-20deg) rotateY(205deg); }
            75% { transform: rotateX(-5deg) rotateY(295deg); }
        }

        /* ── Demo mode badge ── */
        .demo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(244,140,6,0.1);
            border: 1px solid rgba(244,140,6,0.25);
            border-radius: 8px;
            font-size: 11px;
            color: #f48c06;
            margin-bottom: 16px;
        }

        /* ── Honeypot ── */
        .hp-field { position:absolute; left:-9999px; top:-9999px; opacity:0; height:0; width:0; z-index:-1; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#3a3d45; border-radius:3px; }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .auth-card { margin: 12px; border-radius: 14px; }
            .floating-shape { display: none; }
        }
    </style>
</head>
<body class="font-ibm">

    <!-- Background Effects -->
    <div class="grid-floor"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>

    <!-- 3D Particle Canvas -->
    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">

            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-4 mb-3">
                    <div class="logo-cube-wrap">
                        <div class="logo-cube">
                            <div class="face front"></div>
                            <div class="face back"></div>
                            <div class="face right"></div>
                            <div class="face left"></div>
                            <div class="face top"></div>
                            <div class="face bottom"></div>
                        </div>
                    </div>
                    <h1 class="text-3xl font-bold font-cairo" style="background: linear-gradient(135deg, #00b4d8, #48cae4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">مجسّم</h1>
                </div>
                <p class="text-sm" style="color:#6a6d75;">محرر النماذج ثلاثية الأبعاد</p>
            </div>

            <!-- Auth Card -->
            <div class="auth-card p-6 sm:p-8">

                <!-- Demo Mode Badge -->
                <div class="text-center" id="demoBadge" style="display:none;">
                    <div class="demo-badge">
                        <i class="fas fa-flask"></i>
                        <span>وضع تجريبي — لم يتم ربط Firebase بعد</span>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex border-b border-mj-border mb-6">
                    <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">تسجيل الدخول</button>
                    <button class="tab-btn" data-tab="register" onclick="switchTab('register')">حساب جديد</button>
                </div>

                <!-- ========== LOGIN FORM ========== -->
                <form id="loginForm" autocomplete="on" novalidate>
                    <!-- Honeypot -->
                    <div class="hp-field" aria-hidden="true">
                        <label for="hp_email">Leave empty</label>
                        <input type="email" id="hp_email" name="hp_email" tabindex="-1" autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="loginEmail">البريد الإلكتروني</label>
                        <div class="input-wrap">
                            <input type="email" id="loginEmail" name="email" placeholder="you@example.com" dir="ltr" required autocomplete="email">
                            <i class="fas fa-envelope field-icon"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">كلمة المرور</label>
                        <div class="input-wrap">
                            <input type="password" id="loginPassword" name="password" placeholder="••••••••" dir="ltr" required autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePass('loginPassword', this)" aria-label="إظهار كلمة المرور">
                                <i class="fas fa-eye"></i>
                            </button>
                            <i class="fas fa-lock field-icon"></i>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mb-6">
                        <label class="checkbox-wrap">
                            <input type="checkbox" id="rememberMe" name="remember">
                            <span>تذكرني</span>
                        </label>
                        <a href="forgot-password.html" class="text-xs hover:underline" style="color:#00b4d8;">نسيت كلمة المرور؟</a>
                    </div>

                    <button type="submit" class="btn-primary mb-4" id="loginBtn">
                        <span class="btn-text">تسجيل الدخول</span>
                        <div class="spinner"></div>
                    </button>

                    <div class="divider">أو</div>

                    <button type="button" class="btn-social" id="googleLoginBtn" onclick="handleGoogleAuth()">
                        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                        <span>المتابعة بحساب Google</span>
                    </button>
                </form>

                <!-- ========== REGISTER FORM ========== -->
                <form id="registerForm" style="display:none;" autocomplete="on" novalidate>
                    <!-- Honeypot -->
                    <div class="hp-field" aria-hidden="true">
                        <label for="hp_name">Leave empty</label>
                        <input type="text" id="hp_name" name="hp_name" tabindex="-1" autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="regName">الاسم الكامل</label>
                        <div class="input-wrap">
                            <input type="text" id="regName" name="name" placeholder="أحمد محمد" required autocomplete="name">
                            <i class="fas fa-user field-icon"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regEmail">البريد الإلكتروني</label>
                        <div class="input-wrap">
                            <input type="email" id="regEmail" name="email" placeholder="you@example.com" dir="ltr" required autocomplete="email">
                            <i class="fas fa-envelope field-icon"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regPassword">كلمة المرور</label>
                        <div class="input-wrap">
                            <input type="password" id="regPassword" name="password" placeholder="••••••••" dir="ltr" required autocomplete="new-password" oninput="checkStrength(this.value)">
                            <button type="button" class="toggle-password" onclick="togglePass('regPassword', this)" aria-label="إظهار كلمة المرور">
                                <i class="fas fa-eye"></i>
                            </button>
                            <i class="fas fa-lock field-icon"></i>
                        </div>
                        <div class="strength-bar" id="strengthBar">
                            <span></span><span></span><span></span><span></span>
                        </div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>

                    <div class="input-group">
                        <label for="regConfirm">تأكيد كلمة المرور</label>
                        <div class="input-wrap">
                            <input type="password" id="regConfirm" name="confirmPassword" placeholder="••••••••" dir="ltr" required autocomplete="new-password">
                            <button type="button" class="toggle-password" onclick="togglePass('regConfirm', this)" aria-label="إظهار كلمة المرور">
                                <i class="fas fa-eye"></i>
                            </button>
                            <i class="fas fa-shield-halved field-icon"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="inviteCode">رمز الدعوة <span style="color:#5a5d65;">(اختياري)</span></label>
                        <div class="input-wrap">
                            <input type="text" id="inviteCode" name="inviteCode" placeholder="XXXX-XXXX" dir="ltr" autocomplete="off">
                            <i class="fas fa-ticket field-icon"></i>
                        </div>
                    </div>

                    <label class="checkbox-wrap mb-5">
                        <input type="checkbox" id="agreeTerms" name="terms" required>
                        <span>أوافق على <a href="#" class="hover:underline" style="color:#00b4d8;">الشروط والأحكام</a> و<a href="#" class="hover:underline" style="color:#00b4d8;">سياسة الخصوصية</a></span>
                    </label>

                    <button type="submit" class="btn-primary mb-4 mt-2" id="registerBtn">
                        <span class="btn-text">إنشاء الحساب</span>
                        <div class="spinner"></div>
                    </button>

                    <div class="divider">أو</div>

                    <button type="button" class="btn-social" onclick="handleGoogleAuth()">
                        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                        <span>التسجيل بحساب Google</span>
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <p class="text-center text-xs mt-6" style="color:#5a5d65;">
                &copy; 2024 مجسّم — جميع الحقوق محفوظة
            </p>
        </div>
    </div>

    <script>
    // ══════════════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════════════
    const isFirebaseReady = !!(window.MJ && window.MJ.auth);
    if (!isFirebaseReady) {
        document.getElementById('demoBadge').style.display = 'block';
    }

    // ══════════════════════════════════════════════
    //  BACKGROUND PARTICLES
    // ══════════════════════════════════════════════
    (function() {
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 50;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.z = Math.random() * 2 + 0.5;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.3 + 0.05;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.z, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 180, 216, ${this.alpha})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 180, 216, ${0.06 * (1 - dist / 150)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            drawLines();
            requestAnimationFrame(animate);
        }
        animate();
    })();

    // ══════════════════════════════════════════════
    //  TAB SWITCHING
    // ══════════════════════════════════════════════
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    // ══════════════════════════════════════════════
    //  PASSWORD TOGGLE
    // ══════════════════════════════════════════════
    function togglePass(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // ══════════════════════════════════════════════
    //  PASSWORD STRENGTH
    // ══════════════════════════════════════════════
    function checkStrength(password) {
        const bars = document.querySelectorAll('#strengthBar span');
        const text = document.getElementById('strengthText');
        let score = 0;

        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
        if (/\d/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;

        let level = 0;
        if (score >= 5) level = 4;
        else if (score >= 4) level = 3;
        else if (score >= 3) level = 2;
        else if (score >= 1) level = 1;

        const colors = ['', '#ef4444', '#f48c06', '#eab308', '#10b981'];
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

        bars.forEach((bar, i) => {
            bar.style.background = i < level ? colors[level] : '#3a3d45';
        });
        text.textContent = password ? labels[level] : '';
        text.style.color = colors[level] || '#5a5d65';
    }

    // ══════════════════════════════════════════════
    //  TOAST NOTIFICATIONS
    // ══════════════════════════════════════════════
    function showToast(message, type = 'info', duration = 4000) {
        const container = document.getElementById('toastContainer');
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('hide');
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    // ══════════════════════════════════════════════
    //  VALIDATION HELPERS
    // ══════════════════════════════════════════════
    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function setLoading(btn, loading) {
        if (loading) {
            btn.classList.add('loading');
            btn.disabled = true;
        } else {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    }

    function isBot(form) {
        const hp = form.querySelector('[name="hp_email"], [name="hp_name"]');
        return hp && hp.value.length > 0;
    }

    // ══════════════════════════════════════════════
    //  LOGIN
    // ══════════════════════════════════════════════
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        if (isBot(this)) return;

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');

        if (!email || !isValidEmail(email)) {
            showToast('يرجى إدخال بريد إلكتروني صحيح', 'error');
            return;
        }
        if (!password || password.length < 6) {
            showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
            return;
        }

        setLoading(btn, true);

        try {
            if (isFirebaseReady) {
                await window.MJ.auth.signInWithEmailAndPassword(email, password);
                showToast('تم تسجيل الدخول بنجاح!', 'success');
                setTimeout(() => window.location.href = 'index.html', 1200);
            } else {
                // Demo mode
                await new Promise(r => setTimeout(r, 1500));
                showToast('تم تسجيل الدخول بنجاح! (وضع تجريبي)', 'success');
                setTimeout(() => window.location.href = 'index.html', 1200);
            }
        } catch (err) {
            const msgs = {
                'auth/user-not-found': 'لم يتم العثور على هذا الحساب',
                'auth/wrong-password': 'كلمة المرور غير صحيحة',
                'auth/too-many-requests': 'محاولات كثيرة جداً، يرجى المحاولة لاحقاً',
                'auth/invalid-credential': 'بيانات الدخول غير صحيحة',
            };
            showToast(msgs[err.code] || 'حدث خطأ أثناء تسجيل الدخول', 'error');
        } finally {
            setLoading(btn, false);
        }
    });

    // ══════════════════════════════════════════════
    //  REGISTER
    // ══════════════════════════════════════════════
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        if (isBot(this)) return;

        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const terms = document.getElementById('agreeTerms').checked;
        const btn = document.getElementById('registerBtn');

        if (!name || name.length < 2) {
            showToast('يرجى إدخال الاسم الكامل', 'error'); return;
        }
        if (!email || !isValidEmail(email)) {
            showToast('يرجى إدخال بريد إلكتروني صحيح', 'error'); return;
        }
        if (!password || password.length < 8) {
            showToast('كلمة المرور يجب أن تكون 8 أحرف على الأقل', 'error'); return;
        }
        if (password !== confirm) {
            showToast('كلمتا المرور غير متطابقتين', 'error'); return;
        }
        if (!terms) {
            showToast('يرجى الموافقة على الشروط والأحكام', 'warning'); return;
        }

        setLoading(btn, true);

        try {
            if (isFirebaseReady) {
                const cred = await window.MJ.auth.createUserWithEmailAndPassword(email, password);
                await cred.user.updateProfile({ displayName: name });
                showToast('تم إنشاء الحساب بنجاح! مرحباً بك', 'success');
                setTimeout(() => window.location.href = 'index.html', 1200);
            } else {
                await new Promise(r => setTimeout(r, 1800));
                showToast('تم إنشاء الحساب بنجاح! (وضع تجريبي)', 'success');
                setTimeout(() => window.location.href = 'index.html', 1200);
            }
        } catch (err) {
            const msgs = {
                'auth/email-already-in-use': 'هذا البريد الإلكتروني مسجّل مسبقاً',
                'auth/weak-password': 'كلمة المرور ضعيفة جداً',
                'auth/invalid-email': 'البريد الإلكتروني غير صالح',
            };
            showToast(msgs[err.code] || 'حدث خطأ أثناء إنشاء الحساب', 'error');
        } finally {
            setLoading(btn, false);
        }
    });

    // ══════════════════════════════════════════════
    //  GOOGLE AUTH
    // ══════════════════════════════════════════════
    async function handleGoogleAuth() {
        try {
            if (isFirebaseReady && window.MJ.googleProvider) {
                const result = await window.MJ.auth.signInWithPopup(window.MJ.googleProvider);
                showToast(`مرحباً ${result.user.displayName || ''}!`, 'success');
                setTimeout(() => window.location.href = 'index.html', 1200);
            } else {
                showToast('تسجيل Google غير متاح حالياً (وضع تجريبي)', 'warning');
            }
        } catch (err) {
            if (err.code !== 'auth/popup-closed-by-user') {
                showToast('حدث خطأ أثناء تسجيل الدخول بـ Google', 'error');
            }
        }
    }

    // ══════════════════════════════════════════════
    //  KEYBOARD SHORTCUT: Enter to switch forms
    // ══════════════════════════════════════════════
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Tab' && e.altKey) {
            e.preventDefault();
            const current = document.querySelector('.tab-btn.active').dataset.tab;
            switchTab(current === 'login' ? 'register' : 'login');
        }
    });
    </script>
</body>
