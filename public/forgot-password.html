<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجسّم — استعادة كلمة المرور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mj: {
                            bg: '#1a1d23',
                            panel: '#22252b',
                            primary: '#00b4d8',
                            secondary: '#48cae4',
                            text: '#e8edf2',
                            card: '#2a2d35',
                            border: '#3a3d45'
                        }
                    },
                    fontFamily: {
                        sans: ['IBM Plex Sans Arabic', 'Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1a1d23;
            color: #e8edf2;
            font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 180, 216, 0.08) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(72, 202, 228, 0.05) 0%, transparent 25%),
                linear-gradient(rgba(0,180,216,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,180,216,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Toast Notifications -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none">
        <div id="toast-body" class="bg-slate-800 text-white px-5 py-3 rounded-xl shadow-2xl border border-mj-primary flex items-center gap-3">
            <i id="toast-icon" class="fa-solid fa-circle-check text-mj-primary text-lg"></i>
            <span id="toast-text" class="text-sm font-medium"></span>
        </div>
    </div>

    <div class="w-full max-w-md bg-[#22252b] border border-[#3a3d45] rounded-2xl shadow-2xl p-8 relative overflow-hidden backdrop-blur-xl">
        <!-- Top Glow line -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-[#00b4d8] to-transparent"></div>

        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#00b4d8]/10 border border-[#00b4d8]/30 mb-4 shadow-lg shadow-[#00b4d8]/10">
                <i class="fa-solid fa-cube text-2xl text-[#00b4d8]"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">استعادة كلمة المرور</h1>
            <p class="text-xs text-slate-400 mt-2">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور فوراً</p>
        </div>

        <form id="reset-form" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">البريد الإلكتروني المسجل</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="email" required dir="ltr" placeholder="example@domain.com"
                           class="w-full bg-[#1a1d23] border border-[#3a3d45] rounded-xl py-3 pr-10 pl-4 text-white text-sm focus:outline-none focus:border-[#00b4d8] focus:ring-1 focus:ring-[#00b4d8] transition-colors">
                </div>
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full bg-[#00b4d8] hover:bg-[#0096c7] text-[#1a1d23] font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-[#00b4d8]/20 flex items-center justify-center gap-2 cursor-pointer">
                <span>إرسال رابط الاستعادة</span>
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[#3a3d45] text-center">
            <a href="auth.html" class="inline-flex items-center gap-2 text-sm text-[#00b4d8] hover:text-[#48cae4] transition-colors">
                <i class="fa-solid fa-arrow-right text-xs"></i>
                <span>العودة لصفحة تسجيل الدخول</span>
            </a>
        </div>
    </div>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/security.js"></script>

    <script>
        function showToast(text, isError = false) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');
            toastText.textContent = text;
            toastIcon.className = isError 
                ? 'fa-solid fa-triangle-exclamation text-rose-500 text-lg'
                : 'fa-solid fa-circle-check text-[#00b4d8] text-lg';
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 4000);
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('btn-submit');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>جاري الإرسال...</span>';

            try {
                if (window.MJ && window.MJ.resetPassword) {
                    const res = await window.MJ.resetPassword(email);
                    if (res.success) {
                        showToast('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني بنجاح!');
                        setTimeout(() => window.location.href = 'auth.html', 3000);
                        return;
                    } else {
                        showToast(res.error || 'حدث خطأ، يرجى التحقق من البريد المدخل', true);
                    }
                } else {
                    // Fallback demo mode
                    showToast('تم إرسال تعليمات الاستعادة إلى بريدك (وضع العرض)');
                    setTimeout(() => window.location.href = 'auth.html', 3000);
                }
            } catch (err) {
                showToast('تعذر الإرسال: ' + err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>إرسال رابط الاستعادة</span> <i class="fa-solid fa-paper-plane text-sm"></i>';
            }
        });
    </script>
</body>
</html>
