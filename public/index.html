<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مُجسَّم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f1115; color: #e6e8eb;
    }
    .card { text-align: center; padding: 40px 32px; max-width: 380px; width: 100%; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p.sub { color: #8a919c; font-size: 14px; margin-bottom: 28px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px; justify-content: center;
      width: 100%; padding: 12px 18px; border-radius: 10px; border: 1px solid #2a2f37;
      background: #fff; color: #1f1f1f; font: 600 15px 'Cairo', sans-serif; cursor: pointer;
    }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn.secondary { background: transparent; color: #e6e8eb; margin-top: 16px; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; margin-bottom: 12px; }
    .err { color: #f87171; font-size: 13px; margin-top: 14px; min-height: 18px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <section id="signed-out" class="hidden">
      <h1>مُجسَّم</h1>
      <p class="sub">سجّل دخولك للمتابعة</p>
      <button id="google-btn" class="btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        تسجيل الدخول بحساب Google
      </button>
      <div id="err" class="err"></div>
    </section>

    <section id="signed-in" class="hidden">
      <img id="avatar" class="avatar" alt="" referrerpolicy="no-referrer">
      <h1 id="name"></h1>
      <p class="sub" id="email"></p>
      <button id="logout-btn" class="btn secondary">تسجيل الخروج</button>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    MJ.onAuthChange(async (user) => {
      $('signed-out').classList.toggle('hidden', !!user);
      $('signed-in').classList.toggle('hidden', !user);
      if (!user) return;
      $('name').textContent = user.displayName || 'مرحباً';
      $('email').textContent = user.email || '';
      if (user.photoURL) $('avatar').src = user.photoURL; else $('avatar').classList.add('hidden');
      MJ.api('login'); // sync user to database
    });

    $('google-btn').addEventListener('click', async () => {
      $('err').textContent = '';
      $('google-btn').disabled = true;
      const r = await MJ.signInWithGoogle();
      $('google-btn').disabled = false;
      if (!r.success) $('err').textContent = r.error;
    });

    $('logout-btn').addEventListener('click', () => MJ.signOut());
  </script>
</body>
</html>
